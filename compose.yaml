services:
  postgres:
    image: postgres:17-alpine
    container_name: datsan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datsan}
      POSTGRES_USER: ${POSTGRES_USER:-datsan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_datsan_only_change_me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - datsan-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  datsan-postgres-data:
